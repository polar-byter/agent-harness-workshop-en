name: Check English course

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check links and starters
        run: |
          python tools/check_course.py
          python tools/check_english.py
